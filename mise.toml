[tools]
java = "21.0.2"

[tasks.ui]
description = "Run the local Spring Boot operation editor"
run = '''
export GEN2SPRING_JAVA_17_HOME="$(mise where java@17)"
export GEN2SPRING_JAVA_21_HOME="$(mise where java@21)"
export GEN2SPRING_UI_PORT="${GEN2SPRING_UI_PORT:-0}"
exec ./gradlew :apps:web:bootRun --quiet --no-daemon --non-interactive
'''
run_windows = '''
for /f "delims=" %i in ('mise where java@17') do @set "GEN2SPRING_JAVA_17_HOME=%i"
for /f "delims=" %i in ('mise where java@21') do @set "GEN2SPRING_JAVA_21_HOME=%i"
if not defined GEN2SPRING_UI_PORT set "GEN2SPRING_UI_PORT=0"
call gradlew.bat :apps:web:bootRun --quiet --no-daemon --non-interactive
'''

[tasks."ui:build"]
description = "Build the local Spring Boot operation editor JAR"
run = "./gradlew :apps:web:bootJar --no-daemon --non-interactive"
run_windows = ".\\gradlew.bat :apps:web:bootJar --no-daemon --non-interactive"

[tasks."ui:test"]
description = "Run the local operation editor unit tests"
run = "./gradlew :apps:web:test --no-daemon --non-interactive --rerun-tasks"
run_windows = ".\\gradlew.bat :apps:web:test --no-daemon --non-interactive --rerun-tasks"
