[tools]
java = "21.0.2"

[tasks."generator:test"]
description = "Run fast generator contracts without nested generated project builds"
run = '''
export GEN2SPRING_JAVA_17_HOME="$(mise where java@17)"
export GEN2SPRING_JAVA_21_HOME="$(mise where java@21)"
./gradlew \
  :modules:domain:test :modules:application:test \
  :modules:adapters:configuration:test :modules:adapters:emitters:support:test \
  :modules:adapters:emitters:spring-ai-1:fastTest \
  :modules:adapters:emitters:spring-ai-2:fastTest \
  :modules:adapters:validation:test :modules:bootstrap:test :apps:cli:fastTest \
  --no-daemon --non-interactive --rerun-tasks
./gradlew :apps:web:test \
  --tests '*WebMvcContractTest.preservesTheProfilesUploadAndPreviewApi' \
  --tests '*HostedProfileControllerTest.exposesCanonicalProfilesInHostedMode' \
  --tests '*StaticAssetContractTest' \
  --no-daemon --non-interactive --rerun-tasks
'''
run_windows = '''
for /f "delims=" %i in ('mise where java@17') do @set "GEN2SPRING_JAVA_17_HOME=%i"
for /f "delims=" %i in ('mise where java@21') do @set "GEN2SPRING_JAVA_21_HOME=%i"
call gradlew.bat :modules:domain:test :modules:application:test :modules:adapters:configuration:test :modules:adapters:emitters:support:test :modules:adapters:emitters:spring-ai-1:fastTest :modules:adapters:emitters:spring-ai-2:fastTest :modules:adapters:validation:test :modules:bootstrap:test :apps:cli:fastTest --no-daemon --non-interactive --rerun-tasks
if errorlevel 1 exit /b %errorlevel%
call gradlew.bat :apps:web:test --tests "*WebMvcContractTest.preservesTheProfilesUploadAndPreviewApi" --tests "*HostedProfileControllerTest.exposesCanonicalProfilesInHostedMode" --tests "*StaticAssetContractTest" --no-daemon --non-interactive --rerun-tasks
'''

[tasks."generator:acceptance"]
description = "Run full POSIX or representative Windows generated project acceptance"
run = '''
export GEN2SPRING_JAVA_17_HOME="$(mise where java@17)"
export GEN2SPRING_JAVA_21_HOME="$(mise where java@21)"
./gradlew :apps:cli:integrationTest \
  --tests '*P1GenerationIntegrationTest.installedCliValidatesTheJavaProfileMatrixDeterministically' \
  --tests '*P1GenerationIntegrationTest.mavenMvcProfilesValidateAndArchiveDeterministically' \
  --tests '*P1GenerationIntegrationTest.webfluxAsyncProfilesValidateAndArchiveDeterministically' \
  --no-daemon --non-interactive --rerun-tasks
'''
run_windows = '''
for /f "delims=" %i in ('mise where java@17') do @set "GEN2SPRING_JAVA_17_HOME=%i"
for /f "delims=" %i in ('mise where java@21') do @set "GEN2SPRING_JAVA_21_HOME=%i"
call gradlew.bat :apps:cli:integrationTest --tests "*P1GenerationIntegrationTest.windowsRepresentativeProfilesValidateAcrossTargetAxes" --no-daemon --non-interactive --rerun-tasks
'''

[tasks.ui]
description = "Run the local Spring Boot operation editor"
run = '''
export GEN2SPRING_JAVA_17_HOME="$(mise where java@17)"
export GEN2SPRING_JAVA_21_HOME="$(mise where java@21)"
export GEN2SPRING_UI_PORT="${GEN2SPRING_UI_PORT:-0}"
exec ./gradlew :apps:web:bootRun --quiet --no-daemon --non-interactive
'''
run_windows = '''
for /f "delims=" %i in ('mise where java@17') do @set "GEN2SPRING_JAVA_17_HOME=%i"
for /f "delims=" %i in ('mise where java@21') do @set "GEN2SPRING_JAVA_21_HOME=%i"
if not defined GEN2SPRING_UI_PORT set "GEN2SPRING_UI_PORT=0"
call gradlew.bat :apps:web:bootRun --quiet --no-daemon --non-interactive
'''

[tasks."ui:build"]
description = "Build the local Spring Boot operation editor JAR"
run = "./gradlew :apps:web:bootJar --no-daemon --non-interactive"
run_windows = ".\\gradlew.bat :apps:web:bootJar --no-daemon --non-interactive"

[tasks."ui:test"]
description = "Run the local operation editor unit tests"
run = "./gradlew :apps:web:test --no-daemon --non-interactive --rerun-tasks"
run_windows = ".\\gradlew.bat :apps:web:test --no-daemon --non-interactive --rerun-tasks"

[tasks."hosted:config"]
description = "Validate the Linux hosted Compose configuration"
run = "deploy/hosted/bin/validate.sh"

[tasks."hosted:build"]
description = "Build hosted Web, Worker, Runtime, and egress images"
run = '''
deploy/hosted/bin/validate.sh
docker compose --env-file deploy/hosted/.env -f deploy/hosted/compose.yml build web worker fetch-gateway runtime provider-egress
'''

[tasks."hosted:deps"]
description = "Start private PostgreSQL, MinIO, and fetch gateway dependencies"
run = '''
deploy/hosted/bin/validate.sh
docker compose --env-file deploy/hosted/.env -f deploy/hosted/compose.yml up -d postgres minio minio-init fetch-gateway
'''

[tasks."hosted:up"]
description = "Start the fail-closed hosted single-host platform"
run = '''
deploy/hosted/bin/validate.sh
docker compose --env-file deploy/hosted/.env -f deploy/hosted/compose.yml up -d --build
'''

[tasks."hosted:down"]
description = "Stop hosted services without deleting persistent volumes"
run = "docker compose --env-file deploy/hosted/.env -f deploy/hosted/compose.yml down --remove-orphans"

[tasks."hosted:worker"]
description = "Start or restart the dedicated hosted Worker"
run = '''
deploy/hosted/bin/validate.sh
docker compose --env-file deploy/hosted/.env -f deploy/hosted/compose.yml up -d --build worker
'''

[tasks."hosted:runtime"]
description = "Start or restart the isolated Managed Runtime services"
run = '''
deploy/hosted/bin/validate.sh
docker compose --env-file deploy/hosted/.env -f deploy/hosted/compose.yml up -d --build provider-egress runtime proxy
'''

[tasks."hosted:acceptance"]
description = "Run hosted persistence, worker, sandbox, and Web acceptance tests"
run = '''
./gradlew :modules:domain:test :modules:application:test \
  :modules:adapters:persistence-postgres:test :modules:adapters:object-storage-s3:test \
  :modules:adapters:url-fetch:test :modules:adapters:container-runtime:test \
  :modules:adapters:provider-egress:test :modules:adapters:mcp-java-sdk:test \
  :apps:fetch-gateway:test :apps:provider-egress:test :apps:runtime:test :apps:runtime:integrationTest \
  :apps:worker:test :apps:worker:integrationTest :apps:web:test \
  --no-daemon --non-interactive --rerun-tasks
'''

[tasks."hosted:backup"]
description = "Create a PostgreSQL backup in a private caller-selected directory"
run = "deploy/hosted/bin/backup.sh"

[tasks."hosted:restore-rehearsal"]
description = "Verify a hosted PostgreSQL backup in an isolated PostgreSQL 17.9 container"
run = "deploy/hosted/bin/restore-rehearsal.sh"
