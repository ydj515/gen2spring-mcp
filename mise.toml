[tools]
java = "21.0.2"

[tasks.ui]
description = "Build and run the local operation editor"
depends = ["ui:build"]
run = '''
export GEN2SPRING_JAVA_17_HOME="$(mise where java@17)"
export GEN2SPRING_JAVA_21_HOME="$(mise where java@21)"
exec generator-web/build/install/gen2spring-mcp-web/bin/gen2spring-mcp-web \
  --port "${GEN2SPRING_UI_PORT:-0}"
'''
run_windows = '''
for /f "delims=" %i in ('mise where java@17') do @set "GEN2SPRING_JAVA_17_HOME=%i"
for /f "delims=" %i in ('mise where java@21') do @set "GEN2SPRING_JAVA_21_HOME=%i"
if not defined GEN2SPRING_UI_PORT set "GEN2SPRING_UI_PORT=0"
call generator-web\build\install\gen2spring-mcp-web\bin\gen2spring-mcp-web.bat --port %GEN2SPRING_UI_PORT%
'''

[tasks."ui:build"]
description = "Build the local operation editor distribution"
run = "./gradlew :generator-web:installDist --no-daemon --non-interactive"
run_windows = ".\\gradlew.bat :generator-web:installDist --no-daemon --non-interactive"

[tasks."ui:test"]
description = "Run the local operation editor unit tests"
run = "./gradlew :generator-web:test --no-daemon --non-interactive --rerun-tasks"
run_windows = ".\\gradlew.bat :generator-web:test --no-daemon --non-interactive --rerun-tasks"
