worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  access_log off;
  error_log /dev/stderr warn;
  server_tokens off;
  client_body_temp_path /tmp/client-body;
  proxy_temp_path /tmp/proxy;
  client_max_body_size 11m;

  server {
    listen 8443 ssl;
    ssl_certificate /run/secrets/tls/fullchain.pem;
    ssl_certificate_key /run/secrets/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    # Job progress is a server-sent event stream. Buffering would hold events
    # until a buffer filled, and the default 60s read timeout would sever an
    # idle stream, so both are relaxed here only. Every proxy_set_header from
    # the catch-all is repeated because nginx does not inherit them into a
    # sibling location. The pattern matches a UUID because hosted JobId wraps
    # java.util.UUID; local mode's 64-character hex ids never reach this proxy.
    # The regex is quoted because nginx reads an unquoted { as a block opener
    # and rejects the {36} repetition as an unknown directive.
    location ~ "^/api/jobs/[a-f0-9-]{36}/events$" {
      proxy_pass http://web:8080;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 30m;
      proxy_set_header Host $host;
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 8443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP "";
      proxy_set_header Connection "";
      proxy_hide_header Server;
    }

    location ~ "^/mcp/[a-f0-9-]{36}$" {
      proxy_pass http://runtime:8081;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 30m;
      proxy_set_header Host $host;
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 8443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP "";
      proxy_set_header Connection "";
      proxy_hide_header Server;
    }

    location / {
      proxy_pass http://web:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 8443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP "";
      proxy_set_header Connection "";
      proxy_hide_header Server;
    }
  }
}
