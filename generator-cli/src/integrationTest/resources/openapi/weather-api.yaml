openapi: 3.0.3
info:
  title: Weather Forecast API
  version: 1.0.0
servers:
  - url: https://weather.example.test
paths:
  /stations/{stationId}/forecast:
    get:
      operationId: getForecast
      summary: Get the public weather forecast for a station.
      parameters:
        - name: stationId
          in: path
          required: true
          description: Station identifier.
          schema:
            type: string
            minLength: 2
            maxLength: 12
            pattern: '^[A-Z0-9]+$'
        - name: days
          in: query
          required: true
          description: Number of forecast days.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 7
        - name: latitude
          in: query
          required: true
          description: Latitude.
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          required: true
          description: Longitude.
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: cursor
          in: query
          required: false
          description: Internal pagination cursor.
          schema:
            type: string
        - name: mode
          in: query
          required: false
          description: Forecast detail mode.
          schema:
            type: string
            enum: [brief, full-detail]
        - name: tags
          in: query
          required: false
          description: Optional forecast tags.
          schema:
            type: array
            items:
              type: string
        - name: clientVersion
          in: header
          required: false
          description: Calling client version.
          schema:
            type: string
        - name: serviceKey
          in: query
          required: true
          schema:
            type: string
        - name: X-Weather-Key
          in: header
          required: true
          schema:
            type: string
      security:
        - WeatherQueryKey: []
          WeatherHeaderKey: []
      responses:
        '200':
          description: Forecast response.
          content:
            application/json:
              schema:
                type: object
                required: [response]
                properties:
                  response:
                    type: object
                    required: [header, body]
                    properties:
                      header:
                        type: object
                        required: [resultCode, resultMsg]
                        properties:
                          resultCode: {type: string}
                          resultMsg: {type: string}
                          rawHeader: {type: boolean}
                      body:
                        type: object
                        required: [items, totalCount]
                        properties:
                          items:
                            type: object
                            required: [item]
                            properties:
                              item:
                                type: array
                                items:
                                  type: object
                                  required: [forecast]
                                  properties:
                                    forecast: {type: string}
                          nextCursor: {type: string, nullable: true}
                          totalCount: {type: integer, format: int64, minimum: 0}
                          rawBody: {type: boolean}
                  rawRoot: {type: boolean}
components:
  securitySchemes:
    WeatherHeaderKey:
      type: apiKey
      in: header
      name: X-Weather-Key
    WeatherQueryKey:
      type: apiKey
      in: query
      name: serviceKey
