name: Generation Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Temurin 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Capture Java 17 home
        shell: bash
        run: echo "GEN2SPRING_JAVA_17_HOME=$(realpath "$JAVA_HOME")" >> "$GITHUB_ENV"
      - name: Install Temurin 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Capture Java 21 home
        shell: bash
        run: echo "GEN2SPRING_JAVA_21_HOME=$(realpath "$JAVA_HOME")" >> "$GITHUB_ENV"
      - name: Validate all Linux generation profiles
        run: >-
          ./gradlew :apps:cli:integrationTest
          --tests '*P1GenerationIntegrationTest.installedCliValidatesTheJavaProfileMatrixDeterministically'
          --tests '*P1GenerationIntegrationTest.mavenMvcProfilesValidateAndArchiveDeterministically'
          --tests '*P1GenerationIntegrationTest.webfluxAsyncProfilesValidateAndArchiveDeterministically'
          --no-daemon --non-interactive --rerun-tasks

  windows-representative:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Temurin 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Capture Java 17 home
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "GEN2SPRING_JAVA_17_HOME=$((Resolve-Path -LiteralPath $env:JAVA_HOME).ProviderPath)"
      - name: Install Temurin 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Capture Java 21 home
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "GEN2SPRING_JAVA_21_HOME=$((Resolve-Path -LiteralPath $env:JAVA_HOME).ProviderPath)"
      - name: Validate representative Windows generation profiles
        shell: pwsh
        run: >-
          .\gradlew.bat :apps:cli:integrationTest
          --tests '*P1GenerationIntegrationTest.windowsRepresentativeProfilesValidateAcrossTargetAxes'
          --no-daemon --non-interactive --rerun-tasks
