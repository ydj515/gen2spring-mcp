name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Temurin 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17.0.2'
      - name: Capture Java 17 home
        shell: bash
        run: echo "GEN2SPRING_JAVA_17_HOME=$(realpath "$JAVA_HOME")" >> "$GITHUB_ENV"
      - name: Install Temurin 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21.0.2'
      - name: Capture Java 21 home
        shell: bash
        run: echo "GEN2SPRING_JAVA_21_HOME=$(realpath "$JAVA_HOME")" >> "$GITHUB_ENV"
      - name: Verify Java quality and architecture
        run: ./gradlew architectureTest --no-daemon --non-interactive
      - name: Test Linux generator contracts
        run: >-
          ./gradlew clean
          :modules:domain:test
          :modules:application:test
          :modules:adapters:configuration:test
          :modules:adapters:openapi:test
          :modules:adapters:filesystem:test
          :modules:adapters:emitters:support:test
          :modules:adapters:emitters:spring-ai-1:fastTest
          :modules:adapters:emitters:spring-ai-2:fastTest
          :modules:adapters:validation:fastTest
          :modules:bootstrap:test
          :apps:cli:fastTest
          :apps:cli:installDist
          --no-daemon --non-interactive --rerun-tasks
      - name: Verify Linux coverage thresholds and Web contracts
        run: >-
          ./gradlew coverageVerification --no-daemon --non-interactive

  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Temurin 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17.0.2'
      - name: Capture Java 17 home
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "GEN2SPRING_JAVA_17_HOME=$((Resolve-Path -LiteralPath $env:JAVA_HOME).ProviderPath)"
      - name: Install Temurin 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21.0.2'
      - name: Capture Java 21 home
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "GEN2SPRING_JAVA_21_HOME=$((Resolve-Path -LiteralPath $env:JAVA_HOME).ProviderPath)"
      - name: Verify Java quality and architecture
        shell: pwsh
        run: .\gradlew.bat architectureTest --no-daemon --non-interactive
      - name: Test Windows generator contracts
        shell: pwsh
        run: >-
          .\gradlew.bat clean
          :modules:domain:test
          :modules:application:test
          :modules:adapters:configuration:test
          :modules:adapters:openapi:test
          :modules:adapters:filesystem:test
          :modules:adapters:emitters:support:test
          :modules:adapters:emitters:spring-ai-1:fastTest
          :modules:adapters:emitters:spring-ai-2:fastTest
          :modules:adapters:validation:fastTest
          :modules:bootstrap:test
          :apps:cli:fastTest
          :apps:cli:installDist
          --no-daemon --non-interactive --rerun-tasks
      - name: Verify Windows coverage thresholds and Web contracts
        shell: pwsh
        run: >-
          .\gradlew.bat coverageVerification --no-daemon --non-interactive
