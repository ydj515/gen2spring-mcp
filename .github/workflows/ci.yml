name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Temurin 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Capture Java 17 home
        shell: bash
        run: echo "GEN2SPRING_JAVA_17_HOME=$(realpath "$JAVA_HOME")" >> "$GITHUB_ENV"
      - name: Install Temurin 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Capture Java 21 home
        shell: bash
        run: echo "GEN2SPRING_JAVA_21_HOME=$(realpath "$JAVA_HOME")" >> "$GITHUB_ENV"
      - name: Test Linux generator contracts
        run: >-
          ./gradlew clean
          :modules:domain:test
          :modules:application:test
          :modules:adapters:configuration:test
          :modules:adapters:openapi:test
          :modules:adapters:filesystem:test
          :modules:adapters:emitters:support:test
          :modules:adapters:emitters:spring-ai-1:fastTest
          :modules:adapters:emitters:spring-ai-2:fastTest
          :modules:adapters:validation:test
          :modules:bootstrap:test
          :apps:cli:fastTest
          :apps:cli:installDist
          --no-daemon --non-interactive --rerun-tasks
      - name: Test Linux Web profile contracts
        run: >-
          ./gradlew :apps:web:test
          --tests '*WebMvcContractTest.preservesTheProfilesUploadAndPreviewApi'
          --tests '*HostedProfileControllerTest.exposesCanonicalProfilesInHostedMode'
          --tests '*StaticAssetContractTest'
          --no-daemon --non-interactive --rerun-tasks

  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Temurin 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Capture Java 17 home
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "GEN2SPRING_JAVA_17_HOME=$((Resolve-Path -LiteralPath $env:JAVA_HOME).ProviderPath)"
      - name: Install Temurin 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Capture Java 21 home
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "GEN2SPRING_JAVA_21_HOME=$((Resolve-Path -LiteralPath $env:JAVA_HOME).ProviderPath)"
      - name: Test Windows generator contracts
        shell: pwsh
        run: >-
          .\gradlew.bat clean
          :modules:domain:test
          :modules:application:test
          :modules:adapters:configuration:test
          :modules:adapters:openapi:test
          :modules:adapters:filesystem:test
          :modules:adapters:emitters:support:test
          :modules:adapters:emitters:spring-ai-1:fastTest
          :modules:adapters:emitters:spring-ai-2:fastTest
          :modules:adapters:validation:test
          :modules:bootstrap:test
          :apps:cli:fastTest
          :apps:cli:installDist
          --no-daemon --non-interactive --rerun-tasks
      - name: Test Windows Web profile contracts
        shell: pwsh
        run: >-
          .\gradlew.bat :apps:web:test
          --tests '*WebMvcContractTest.preservesTheProfilesUploadAndPreviewApi'
          --tests '*HostedProfileControllerTest.exposesCanonicalProfilesInHostedMode'
          --tests '*StaticAssetContractTest'
          --no-daemon --non-interactive --rerun-tasks
