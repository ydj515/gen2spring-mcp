<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/ui :: head-assets('Gen2Spring MCP 작업 상세')}">
  <title>Gen2Spring MCP 작업 상세</title>
</head>
<body class="app-shell">
  <header th:replace="~{fragments/ui :: app-header('hosted')}" class="app-header"></header>
  <main class="app-main hosted-shell">
    <nav class="breadcrumb-nav" aria-label="현재 위치"><a href="/"><i class="bi bi-arrow-left" aria-hidden="true"></i> 작업 목록</a></nav>
    <header class="page-header">
      <div><p class="page-eyebrow">JOB DETAIL</p><h1>작업 상세</h1><p>실행 상태와 단계별 이력, 생성 산출물을 확인합니다.</p></div>
    </header>
    <section class="surface" aria-labelledby="job-summary-title">
      <div class="surface-heading"><h2 id="job-summary-title">현재 상태</h2><span class="status-badge" th:text="${job.status}">QUEUED</span></div>
      <dl class="detail-grid">
        <div><dt>작업 유형</dt><dd th:text="${job.kind}">GENERATION</dd></div>
        <div><dt>시도 횟수</dt><dd th:text="${job.attempt}">0</dd></div>
      </dl>
      <form class="job-cancel-form" method="post" th:action="@{/api/jobs/{id}/cancellation(id=${job.id.value})}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="secondary" type="submit">작업 취소</button>
      </form>
    </section>
    <section class="surface" aria-labelledby="timeline-title">
      <div class="surface-heading"><h2 id="timeline-title">진행 이력</h2></div>
      <ol class="job-timeline"><li th:each="event : ${events}"><strong th:text="${event.toStatus}">STATUS</strong><time th:text="${event.createdAt}">시간</time></li></ol>
    </section>
    <section class="surface" aria-labelledby="artifacts-title">
      <div class="surface-heading"><h2 id="artifacts-title">산출물</h2></div>
      <ul class="artifact-list"><li th:each="artifact : ${artifacts}"><a th:href="@{/api/artifacts/{id}/content(id=${artifact.id})}" th:text="${artifact.type}">산출물</a></li><li class="empty-state" th:if="${#lists.isEmpty(artifacts)}">아직 게시된 산출물이 없습니다.</li></ul>
    </section>
  </main>
</body>
</html>
