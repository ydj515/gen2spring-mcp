<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hosted job</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="shell hosted-shell"><a href="/">Back to dashboard</a><section class="panel"><h1>Job</h1><dl><dt>Status</dt><dd th:text="${job.status}">QUEUED</dd><dt>Kind</dt><dd th:text="${job.kind}">GENERATION</dd><dt>Attempt</dt><dd th:text="${job.attempt}">0</dd></dl><form method="post" th:action="@{/api/jobs/{id}/cancellation(id=${job.id.value})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">Cancel</button></form></section><section class="panel"><h2>Timeline</h2><ol><li th:each="event : ${events}"><strong th:text="${event.toStatus}">STATUS</strong> <time th:text="${event.createdAt}">time</time></li></ol></section><section class="panel"><h2>Artifacts</h2><ul><li th:each="artifact : ${artifacts}"><a th:href="@{/api/artifacts/{id}/content(id=${artifact.id})}" th:text="${artifact.type}">artifact</a></li><li th:if="${#lists.isEmpty(artifacts)}">No artifacts published.</li></ul></section></main></body>
</html>
