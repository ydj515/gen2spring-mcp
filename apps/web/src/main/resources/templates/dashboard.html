<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/ui :: head-assets('Gen2Spring MCP 작업 목록')}">
  <title>Gen2Spring MCP 작업 목록</title>
</head>
<body class="app-shell">
  <header th:replace="~{fragments/ui :: app-header('hosted')}" class="app-header"></header>
  <main class="app-main hosted-shell">
    <header class="page-header">
      <div>
        <p class="page-eyebrow">HOSTED WORKSPACE</p>
        <h1>작업 목록</h1>
        <p>OpenAPI 문서와 MCP 생성 작업을 한곳에서 관리합니다.</p>
      </div>
      <a class="primary-link" href="/editor"><i class="bi bi-plus-lg" aria-hidden="true"></i> 새 MCP 프로젝트</a>
    </header>

    <section class="surface hosted-actions" aria-labelledby="import-title">
      <div class="surface-heading">
        <div><p class="section-kicker">URL IMPORT</p><h2 id="import-title">OpenAPI URL 가져오기</h2></div>
        <p>외부 공개 HTTP(S) URL을 안전하게 가져와 분석 대기열에 추가합니다.</p>
      </div>
      <form id="hosted-import-form">
        <label for="import-url">공개 OpenAPI URL</label>
        <input id="import-url" name="url" type="url" placeholder="https://example.com/openapi.yaml" required>
        <button type="submit">가져오기</button>
      </form>
      <p id="hosted-feedback" class="status" role="status" aria-live="polite"></p>
    </section>

    <section class="surface" aria-labelledby="specifications-title">
      <div class="surface-heading">
        <div><p class="section-kicker">SPECIFICATIONS</p><h2 id="specifications-title">OpenAPI 문서</h2></div>
        <span class="count-badge" th:text="${#lists.size(specifications)} + '개'">0개</span>
      </div>
      <ul class="hosted-list">
        <li th:each="spec : ${specifications}">
          <a th:href="@{/editor(specification=${spec.id.value})}"><strong th:text="${spec.label}">OpenAPI 문서</strong></a>
          <span class="status-badge" th:text="${spec.sourceType}">UPLOAD</span>
          <code th:text="${spec.id.value}">id</code>
        </li>
        <li class="empty-state" th:if="${#lists.isEmpty(specifications)}">아직 등록된 OpenAPI 문서가 없습니다.</li>
      </ul>
    </section>

    <section class="surface" aria-labelledby="jobs-title">
      <div class="surface-heading">
        <div><p class="section-kicker">JOBS</p><h2 id="jobs-title">작업 내역</h2></div>
        <span class="count-badge" th:text="${#lists.size(jobs)} + '개'">0개</span>
      </div>
      <ul class="hosted-list">
        <li th:each="job : ${jobs}">
          <a th:href="@{/jobs/{id}(id=${job.id.value})}" th:text="${job.kind + ' · ' + job.status}">작업</a>
          <time th:text="${job.createdAt}">시간</time>
        </li>
        <li class="empty-state" th:if="${#lists.isEmpty(jobs)}">아직 실행한 작업이 없습니다.</li>
      </ul>
    </section>
  </main>
  <script src="/hosted.js" defer></script>
</body>
</html>
